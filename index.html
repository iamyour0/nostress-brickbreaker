
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO STRESS BRICK BREAKER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101426;color:#fff;
 font-family:Arial,sans-serif;text-align:center;
 padding:18px 10px 30px
}
h1{font-size:clamp(22px,4vw,34px);margin:8px 0;color:#8ee8ff}
.sub{color:#aab5d0;font-size:13px;margin-bottom:14px}
.game{max-width:900px;margin:auto}
.panel{
 display:flex;justify-content:center;align-items:center;
 gap:10px;flex-wrap:wrap;margin:12px auto
}
.stat{
 background:#202943;border:1px solid #354363;
 border-radius:10px;padding:9px 15px;min-width:90px
}
.stat small{display:block;color:#9eabc9;font-size:11px}
.stat b{font-size:18px}
button,select{
 border:0;border-radius:9px;padding:11px 16px;
 background:#30466f;color:white;font-weight:bold;
 cursor:pointer;font-size:14px
}
button.primary{background:#16a6bd;color:#071722}
button:hover{filter:brightness(1.15)}
canvas{
 display:block;width:100%;height:auto;
 background:#151e35;border:2px solid #35496e;
 border-radius:12px;touch-action:none;
 box-shadow:0 8px 35px #0008
}
.help{color:#aab5d0;font-size:12px;line-height:1.8;margin:12px auto}
.message{color:#8ee8ff;font-weight:bold;min-height:22px}
@media(max-width:500px){
 body{padding:10px 7px}
 .stat{min-width:75px;padding:7px 9px}
 button,select{padding:10px 12px}
}
</style>
</head>
<body>
<div class="game">
<h1>🧱 NO STRESS BRICK BREAKER</h1>
<div class="sub">Relax, play and enjoy breaking bricks!</div>

<div class="panel">
 <div class="stat"><small>SCORE</small><b id="score">0</b></div>
 <div class="stat"><small>BEST</small><b id="best">0</b></div>
 <div class="stat"><small>STAGE</small><b id="stage">1</b></div>
 <div class="stat"><small>LIVES</small><b id="lives">5</b></div>
</div>

<div class="panel">
 <select id="difficulty">
  <option value="easy">Relax Mode</option>
  <option value="normal">Normal Mode</option>
  <option value="hard">Challenge Mode</option>
 </select>
 <button class="primary" id="start">▶ PLAY</button>
 <button id="pause">Ⅱ PAUSE</button>
 <button id="restart">↻ RESTART</button>
</div>

<canvas id="gameCanvas" width="900" height="600"></canvas>
<div class="message" id="message">Press PLAY to start</div>
<div class="help">
 Move: Mouse / Touch / ← → keys<br>
 Space: Launch ball · P: Pause<br>
 Catch falling power-ups with your paddle!
</div>
</div>

<script>
(()=>{
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

const W=900,H=600;
let score=0,stage=1,lives=5,best=0;
let running=false,paused=false,launched=false;
let balls=[],bricks=[],items=[];
let lasers=[];
let shield=0,wide=0,laser=0;
let paddle={x:390,y:555,w:120,h:14};
let keys={};
let lastTime=0;
let message="Press PLAY to start";
let difficulty="easy";
let baseSpeed=4.0;

try{best=Number(localStorage.getItem("nsbb-best"))||0}catch(e){}
$("best").textContent=best;

function say(t){message=t;$("message").textContent=t}
function updateStats(){
 $("score").textContent=score;
 $("best").textContent=best;
 $("stage").textContent=stage;
 $("lives").textContent=lives;
}
function settings(){
 difficulty=$("difficulty").value;
 baseSpeed=difficulty==="easy"?4.0:difficulty==="normal"?4.8:5.6;
 lives=difficulty==="easy"?5:difficulty==="normal"?4:3;
}
function newBall(){
 let speed=baseSpeed+Math.min(stage*.12,2);
 balls=[{x:W/2,y:520,vx:speed*.65,vy:-speed,r:9}];
 launched=false;
}
function makeBricks(){
 bricks=[];
 let rows=Math.min(5+Math.floor((stage-1)/2),8);
 let cols=10;
 let gap=7,bw=77,bh=24;
 let left=(W-(cols*bw+(cols-1)*gap))/2;
 const colors=["#ff7188","#ffb45e","#f6df70","#71dcae","#6dc9ff","#b69aff","#ff8bd4","#8ee8ff"];
 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   let tough=stage>=3&&r<Math.floor(stage/3);
   bricks.push({
    x:left+c*(bw+gap),y:65+r*(bh+gap),
    w:bw,h:bh,hp:tough?2:1,max:tough?2:1,
    color:colors[r%colors.length]
   });
  }
 }
}
function resetGame(){
 score=0;stage=1;settings();items=[];lasers=[];
 shield=0;wide=0;laser=0;
 paddle.w=120;paddle.x=(W-paddle.w)/2;
 makeBricks();newBall();running=true;paused=false;
 $("pause").textContent="Ⅱ PAUSE";
 updateStats();say("Good luck! Enjoy the game.");
}
function launch(){
 if(!running||paused)return;
 if(!launched){
  launched=true;
  say("Keep it relaxing!");
 }
}
function nextStage(){
 stage++;
 makeBricks();
 newBall();
 items=[];
 say("Stage "+stage+" — Nice work!");
 updateStats();
}
function loseLife(){
 lives--;updateStats();
 if(lives<=0){
  running=false;launched=false;
  say("Game over — Press RESTART to try again");
 }else{
  newBall();
  say("One more chance! Press PLAY to launch.");
 }
}
function dropItem(x,y){
 if(Math.random()>.20)return;
 const types=["wide","multi","shield","laser"];
 items.push({x,y,type:types[Math.floor(Math.random()*types.length)],vy:2.2});
}
function activate(type){
 if(type==="wide"){
  wide=900;paddle.w=190;
  say("✨ WIDE PADDLE!");
 }
 if(type==="multi"){
  let source=balls[0];
  if(source){
   for(let i=0;i<2;i++){
    balls.push({x:source.x,y:source.y,vx:source.vx*(i?-.8:.8),vy:source.vy,r:9});
   }
  }
  say("⚡ MULTI BALL!");
 }
 if(type==="shield"){
  shield=1;say("🛡️ SAFETY SHIELD!");
 }
 if(type==="laser"){
  laser=900;say("🔫 LASER POWER!");
 }
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hitRect(ball,rect){
 return ball.x+ball.r>rect.x&&ball.x-ball.r<rect.x+rect.w&&
 ball.y+ball.r>rect.y&&ball.y-ball.r<rect.y+rect.h;
}
function update(dt){
 if(!running||paused)return;
 let step=Math.min(dt/16.67,2);

 if(keys.ArrowLeft||keys.a)paddle.x-=7*step;
 if(keys.ArrowRight||keys.d)paddle.x+=7*step;
 paddle.x=clamp(paddle.x,0,W-paddle.w);

 if(!launched){
  balls[0].x=paddle.x+paddle.w/2;
  balls[0].y=paddle.y-12;
 }
 if(wide>0){wide-=dt;if(wide<=0)paddle.w=120}
 if(laser>0)laser-=dt;

 for(let b of balls){
  if(!launched)continue;
  b.x+=b.vx*step;b.y+=b.vy*step;

  if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)}
  if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)}
  if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)}

  if(b.vy>0&&hitRect(b,paddle)){
   b.y=paddle.y-b.r;
   let hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
   b.vx=hit*baseSpeed*1.35;
   b.vy=-Math.sqrt(Math.max(5,baseSpeed*baseSpeed-b.vx*b.vx*.45));
  }

  for(let br of bricks){
   if(br.hp>0&&hitRect(b,br)){
    br.hp--;
    score+=10;
    if(br.hp===0)dropItem(br.x+br.w/2,br.y+br.h/2);
    b.vy*=-1;
    break;
   }
  }
 }
 balls=balls.filter(b=>b.y-b.r<H+10);
 if(launched&&balls.length===0){
  if(shield){
   shield=0;newBall();say("Shield saved you!");
  }else loseLife();
 }

 for(let item of items){
  item.y+=item.vy*step;
  if(item.y+10>=paddle.y&&item.y<=paddle.y+paddle.h&&
     item.x>=paddle.x&&item.x<=paddle.x+paddle.w){
   activate(item.type);item.caught=true;
  }
 }
 items=items.filter(i=>!i.caught&&i.y<H+20);

 if(laser>0&&launched&&Math.random()<.12*step){
  lasers.push({x:paddle.x+paddle.w*.3,y:paddle.y,vy:-9});
  lasers.push({x:paddle.x+paddle.w*.7,y:paddle.y,vy:-9});
 }
 for(let l of lasers){
  l.y+=l.vy*step;
  for(let br of bricks){
   if(br.hp>0&&l.x>br.x&&l.x<br.x+br.w&&l.y>br.y&&l.y<br.y+br.h){
    br.hp--;score+=10;l.hit=true;
    if(br.hp===0)dropItem(br.x+br.w/2,br.y+br.h/2);
    break;
   }
  }
 }
 lasers=lasers.filter(l=>!l.hit&&l.y>0);

 if(bricks.every(b=>b.hp<=0))nextStage();

 if(score>best){
  best=score;
  try{localStorage.setItem("nsbb-best",best)}catch(e){}
 }
 updateStats();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#192541");
 grad.addColorStop(1,"#11182c");
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#ffffff0b";ctx.lineWidth=1;
 for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}

 for(let br of bricks){
  if(br.hp<=0)continue;
  ctx.fillStyle=br.color;
  ctx.beginPath();ctx.roundRect(br.x,br.y,br.w,br.h,6);ctx.fill();
  ctx.fillStyle="#ffffff30";
  ctx.fillRect(br.x+5,br.y+4,br.w-10,3);
  if(br.max>1){
   ctx.fillStyle="#17213b";ctx.font="bold 12px Arial";
   ctx.fillText(br.hp,br.x+br.w/2-3,br.y+17);
  }
 }
 ctx.fillStyle="#6fe2ff";
 ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();
 ctx.fillStyle="#ffffff70";
 ctx.fillRect(paddle.x+8,paddle.y+3,paddle.w-16,3);

 if(shield){
  ctx.strokeStyle="#66eaff";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(0,590);ctx.lineTo(W,590);ctx.stroke();
 }
 for(let b of balls){
  ctx.shadowColor="#fff";ctx.shadowBlur=15;
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
 }
 const icons={wide:"↔",multi:"✦",shield:"🛡",laser:"⚡"};
 const colors={wide:"#56d9ff",multi:"#ffdb69",shield:"#8df2bd",laser:"#ff8ad2"};
 for(let i of items){
  ctx.fillStyle=colors[i.type];
  ctx.beginPath();ctx.arc(i.x,i.y,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#17213b";ctx.font="bold 14px Arial";
  ctx.textAlign="center";ctx.fillText(icons[i.type],i.x,i.y+5);
 }
 ctx.fillStyle="#ffb2d2";
 for(let l of lasers)ctx.fillRect(l.x-2,l.y,4,13);

 if(!running||paused||!launched){
  ctx.fillStyle="#080d1c99";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";ctx.fillStyle="#fff";
  ctx.font="bold 32px Arial";
  let title=!running?"GAME OVER":paused?"PAUSED":"READY?";
  ctx.fillText(title,W/2,H/2-10);
  ctx.font="18px Arial";ctx.fillStyle="#b9c8e8";
  ctx.fillText(!running?"Press RESTART":paused?"Press PAUSE to continue":"Press PLAY to launch",W/2,H/2+28);
 }
}
function frame(t){
 let dt=lastTime?Math.min(t-lastTime,40):16.67;
 lastTime=t;update(dt);draw();
 requestAnimationFrame(frame);
}
function pointerMove(e){
 let rect=canvas.getBoundingClientRect();
 let x=(e.clientX-rect.left)/rect.width*W;
 paddle.x=clamp(x-paddle.w/2,0,W-paddle.w);
}
canvas.addEventListener("pointermove",pointerMove);
canvas.addEventListener("pointerdown",e=>{
 pointerMove(e);
 if(running&&!paused&&!launched)launch();
});
$("start").onclick=()=>{
 if(!running){resetGame();launch()}
 else if(!paused)launch();
};
$("pause").onclick=()=>{
 if(!running)return;
 paused=!paused;
 $("pause").textContent=paused?"▶ RESUME":"Ⅱ PAUSE";
 say(paused?"Game paused":"Let's play!");
};
$("restart").onclick=resetGame;
$("difficulty").onchange=()=>{
 if(!running||!launched)resetGame();
};
document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key==="ArrowRight"||e.key===" "){
  keys[e.key]=true;
 }
 if(e.key==="a"||e.key==="d")keys[e.key]=true;
 if(e.key===" "&&running&&!paused)launch();
 if(e.key.toLowerCase()==="p"&&running)$("pause").click();
});
document.addEventListener("keyup",e=>{keys[e.key]=false});
window.addEventListener("blur",()=>{keys={}});
settings();makeBricks();newBall();updateStats();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
